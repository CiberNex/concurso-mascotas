<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Ganadores de Mascota UNADista 2026. Conoce a las mascotas más votadas.">

    <title>Mascota UNADista 2026 | Ganadores</title>

    <link rel="stylesheet" href="css/ganadores.css">
</head>

<body>

    <!-- =====================================================
         HEADER / NAVEGACIÓN
    ====================================================== -->
    <header class="site-header">

        <div class="container nav-wrapper">

            <a href="index.html" class="brand" aria-label="Ir al inicio">
                <img
                    src="assets/logo/Logo UNAD.png"
                    alt="Universidad Nacional Abierta y a Distancia - UNAD"
                    class="logo-unad"
                >
            </a>

            <!-- Menú responsive sin JavaScript -->
            <input
                type="checkbox"
                id="nav-toggle"
                class="nav-toggle-input"
            >

            <label
                for="nav-toggle"
                class="menu-toggle"
                aria-label="Abrir o cerrar menú"
            >
                ☰
            </label>

            <nav class="main-nav" aria-label="Navegación principal">

                <a href="index.html">
                    Inicio
                </a>

                <a href="evento.html">
                    Evento
                </a>

                <a href="actividades.html">
                    Actividades
                </a>

                <a
                    href="ganadores.html"
                    class="active"
                    aria-current="page"
                >
                    Ganadores
                </a>

                <a href="vota-ahora.html" class="nav-cta">
                    ♥ VOTAR AHORA
                </a>

            </nav>

        </div>

    </header>


    <main>

        <!-- =====================================================
             HERO / TÍTULO
        ====================================================== -->
        <section class="winners-hero">

            <!-- Decoración celeste izquierda -->
            <span class="blob blob-left-main" aria-hidden="true"></span>
            <span class="blob-dot blob-left-dot-1" aria-hidden="true"></span>
            <span class="blob-dot blob-left-dot-2" aria-hidden="true"></span>
            <span class="blob-dot blob-left-dot-3" aria-hidden="true"></span>

            <!-- Decoración celeste derecha -->
            <span class="blob blob-right-main" aria-hidden="true"></span>
            <span class="blob-dot blob-right-dot-1" aria-hidden="true"></span>
            <span class="blob-dot blob-right-dot-2" aria-hidden="true"></span>
            <span class="blob-dot blob-right-dot-3" aria-hidden="true"></span>

            <div class="container winners-heading">

                <div class="title-row">

                    <!-- IMAGEN SEGÚN ESQUEMA:
                         reemplaza únicamente este src -->
                    <img
                        src="assets/ganadores/huellas-titulo.png"
                        alt=""
                        class="title-paws"
                    >

                    <h1>Ganadores</h1>

                </div>

                <p>
                    Conoce a las mascotas más votadas de Mascota UNADista 2026.
                </p>

            </div>

        </section>


        <!-- =====================================================
             PODIO DE GANADORES
        ====================================================== -->
        <section class="winners-podium">

            <div class="container podium-grid">

                <!-- =================================================
                     SEGUNDO LUGAR
                ================================================== -->
                <article class="winner winner-second">

                    <div class="winner-photo-frame">

                        <!-- IMAGEN SEGÚN ESQUEMA -->
                        <img
                            src="assets/ganadores/mia.png"
                            alt="Mia, segundo lugar"
                            class="winner-photo"
                        >

                        <!-- IMAGEN SEGÚN ESQUEMA -->
                        <img
                            src="assets/ganadores/puesto-2.png"
                            alt="Segundo lugar"
                            class="ranking-badge ranking-badge-2"
                        >

                    </div>

                    <div class="winner-copy">
                        <h2>Mia</h2>
                        <p>15 votos</p>
                    </div>

                </article>


                <!-- =================================================
                     PRIMER LUGAR
                ================================================== -->
                <article class="winner winner-first">

                    <div class="first-place-card">

                        <div class="winner-photo-frame">

                            <!-- IMAGEN SEGÚN ESQUEMA -->
                            <img
                                src="assets/ganadores/rocky.png"
                                alt="Rocky, primer lugar"
                                class="winner-photo"
                            >

                            <!-- IMAGEN SEGÚN ESQUEMA -->
                            <img
                                src="assets/ganadores/puesto-1.png"
                                alt="Primer lugar"
                                class="ranking-badge ranking-badge-1"
                            >

                            <!-- IMAGEN SEGÚN ESQUEMA -->
                            <img
                                src="assets/ganadores/corona.png"
                                alt=""
                                class="winner-crown"
                            >

                        </div>

                        <div class="winner-copy winner-copy-first">
                            <h2>Rocky</h2>
                            <p>20 votos</p>
                        </div>

                    </div>

                </article>


                <!-- =================================================
                     TERCER LUGAR
                ================================================== -->
                <article class="winner winner-third">

                    <div class="winner-photo-frame">

                        <!-- IMAGEN SEGÚN ESQUEMA -->
                        <img
                            src="assets/ganadores/kiwi.png"
                            alt="Kiwi, tercer lugar"
                            class="winner-photo"
                        >

                        <!-- IMAGEN SEGÚN ESQUEMA -->
                        <img
                            src="assets/ganadores/puesto-3.png"
                            alt="Tercer lugar"
                            class="ranking-badge ranking-badge-3"
                        >

                    </div>

                    <div class="winner-copy">
                        <h2>Kiwi</h2>
                        <p>12 votos</p>
                    </div>

                </article>

            </div>


            <!-- Decoración celeste inferior -->
            <span class="blob blob-bottom-left" aria-hidden="true"></span>
            <span class="blob-dot blob-bottom-left-dot" aria-hidden="true"></span>

            <span class="blob blob-bottom-right" aria-hidden="true"></span>
            <span class="blob-dot blob-bottom-right-dot" aria-hidden="true"></span>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->
    <footer class="site-footer">

        <div class="footer-background" aria-hidden="true">
            <img
                src="assets/fondos/Footer.png"
                alt=""
            >
        </div>

        <div class="container footer-content">

            <div class="footer-message">

                <strong>
                    Porque ellos nos acompañan cada día,<br>
                    ¡hoy es su momento de
                    <span>brillar!</span>
                </strong>

            </div>


            <div class="social">

                <span>
                    Síguenos en nuestras redes
                </span>

                <div class="social-links">

                    <a href="#" aria-label="Facebook">
                        f
                    </a>

                    <a href="#" aria-label="LinkedIn">
                        in
                    </a>

                    <a href="#" aria-label="YouTube">
                        ▶
                    </a>

                    <a href="#" aria-label="Instagram">
                        ◎
                    </a>

                </div>

            </div>

        </div>

    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Ganadores de Mascota UNADista 2026. Conoce a las mascotas más votadas.">

    <title>Mascota UNADista 2026 | Ganadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Chewy&family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>
    <link rel="stylesheet" href="{% static 'css/ganadores.css' %}">
</head>

<body>

    <!-- =====================================================
         HEADER / NAVEGACIÓN
    ====================================================== -->
    <header class="site-header">

        <div class="container nav-wrapper">

            <a href="{% url 'inicio' %}" class="brand" aria-label="Ir al inicio">
                <img
                    src="{% static 'assets/logo/Logo UNAD.png' %}"
                    alt="Universidad Nacional Abierta y a Distancia - UNAD"
                    class="logo-unad"
                >
            </a>

            <!-- Menú responsive sin JavaScript -->
            <input
                type="checkbox"
                id="nav-toggle"
                class="nav-toggle-input"
            >

            <label
                for="nav-toggle"
                class="menu-toggle"
                aria-label="Abrir o cerrar menú"
            >
                ☰
            </label>

                        <nav class="main-nav" aria-label="Navegación principal">

                <a href="{% url 'inicio' %}">
                    Inicio
                </a>

                <a href="{% url 'evento' %}">
                    Evento
                </a>

                <a href="{% url 'actividades' %}">
                    Actividades
                </a>

                <a href="{% url 'ganadores' %}" class="active" aria-current="page">
                    Ganadores
                </a>

                <a href="{% url 'registrar_mascota' %}">
                    Inscripción
                </a>

                <a href="{% url 'galeria' 1 %}" class="nav-cta">
                    ♥ VOTAR AHORA
                </a>

            </nav>

        </div>

    </header>


    <main>

        <!-- =====================================================
             HERO / TÍTULO
        ====================================================== -->
        <section class="winners-hero">


            <div class="container winners-heading">

                <div class="title-row">

                    <!-- IMAGEN SEGÚN ESQUEMA:
                         reemplaza únicamente este src -->
                    <img
                        src="{% static 'assets\iconos\Paw Print 1 Ganadores.png' %}"
                        alt=""
                        class="title-paws"
                    >

                    <h1>Ganadores</h1>

                </div>

                <p>
                    Conoce a las mascotas más votadas de Mascota UNADista 2026.
                </p>

            </div>

        </section>


        <!-- =====================================================
             PODIO DE GANADORES
        ====================================================== -->
        <section class="winners-podium">

            <div class="container podium-grid">

                <!-- =================================================
                     SEGUNDO LUGAR
                ================================================== -->
                <article class="winner winner-second">

                    <div class="winner-photo-frame">

                        <!-- IMAGEN SEGÚN ESQUEMA -->
                        <img
                            src="{% static 'assets\mascotas\Ganadores 2.png' %}"
                            alt="Mia, segundo lugar"
                            class="winner-photo"
                        >

                        <!-- IMAGEN SEGÚN ESQUEMA -->
                        <img
                            src="{% static 'assets\iconos\Ganadores 2.png' %}"
                            alt="Segundo lugar"
                            class="ranking-badge ranking-badge-2"
                        >

                    </div>

                    <div class="winner-copy">
                        <h2>Mia</h2>
                        <p>15 votos</p>
                    </div>

                </article>


                <!-- =================================================
                     PRIMER LUGAR
                ================================================== -->
                <article class="winner winner-first">

                    <div class="first-place-card">

                        <div class="winner-photo-frame">

                            <!-- IMAGEN SEGÚN ESQUEMA -->
                            <img
                                src="{% static 'assets\mascotas\Ganadores 1.png' %}"
                                alt="Rocky, primer lugar"
                                class="winner-photo"
                            >

                            <!-- IMAGEN SEGÚN ESQUEMA -->
                            <img
                                src="{% static 'assets\iconos\Ganadores 1.png' %}"
                                alt="Primer lugar"
                                class="ranking-badge ranking-badge-1"
                            >

                            <!-- IMAGEN SEGÚN ESQUEMA -->
                            <img
                                src="{% static 'assets\iconos\Corona.png' %}"
                                alt=""
                                class="winner-crown"
                            >

                        </div>

                        <div class="winner-copy winner-copy-first">
                            <h2>Rocky</h2>
                            <p>20 votos</p>
                        </div>

                    </div>

                </article>


                <!-- =================================================
                     TERCER LUGAR
                ================================================== -->
                <article class="winner winner-third">

                    <div class="winner-photo-frame">

                        <!-- IMAGEN SEGÚN ESQUEMA -->
                        <img
                            src="{% static 'assets\mascotas\Ganadores 3.png' %}"
                            alt="Kiwi, tercer lugar"
                            class="winner-photo"
                        >

                        <!-- IMAGEN SEGÚN ESQUEMA -->
                        <img
                            src="{% static 'assets\iconos\Ganadores 3.png' %}"
                            alt="Tercer lugar"
                            class="ranking-badge ranking-badge-3"
                        >

                    </div>

                    <div class="winner-copy">
                        <h2>Kiwi</h2>
                        <p>12 votos</p>
                    </div>

                </article>

            </div>


            <!-- Decoración celeste inferior -->
            <span class="blob blob-bottom-left" aria-hidden="true"></span>
            <span class="blob-dot blob-bottom-left-dot" aria-hidden="true"></span>

            <span class="blob blob-bottom-right" aria-hidden="true"></span>
            <span class="blob-dot blob-bottom-right-dot" aria-hidden="true"></span>

        </section>

    </main>


    
   <!-- =====================================================
     FOOTER
====================================================== -->

<footer class="site-footer">

    <!-- Imagen completa del footer -->
    <img
        src="{% static 'assets/fondos/Footer.png' %}"
        alt="Mascota UNADista"
        class="footer-image"
    >

    <!-- Redes sociales -->
    <div class="footer-social">

        <a href="https://www.facebook.com/UniversidadUNAD/"
           aria-label="Facebook">
            <img
                src="{% static 'assets/iconos/Facebook.png' %}"
                alt="Facebook"
            >
        </a>

        <a href="https://www.linkedin.com/school/universidadunad"
           aria-label="LinkedIn">
            <img
                src="{% static 'assets/iconos/Linkedin.png' %}"
                alt="LinkedIn"
            >
        </a>

        <a href="https://www.youtube.com/@universidadunadTvUnadVirtual"
           aria-label="YouTube">
            <img
                src="{% static 'assets/iconos/Youtube.png' %}"
                alt="YouTube"
            >
        </a>

        <a href="https://www.instagram.com/universidadunad"
           aria-label="Instagram">
            <img
                src="{% static 'assets/iconos/Instagram.png' %}"
                alt="Instagram"
            >
        </a>

    </div>

</footer>
<section class="developers-bar" aria-label="Desarrolladores">
    <p>
        Desarrolladores: Anderson Muñoz & Nikol Ramirez
    </p>
</section>
</body>
</html>
